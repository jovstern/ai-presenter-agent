<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Target App — Settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a data-testid="nav-home" href="index.html">Home</a>
      <a data-testid="nav-settings" href="settings.html">Settings</a>
    </nav>

    <h1 data-testid="settings-heading">Settings</h1>

    <p>
      <label>
        <input data-testid="notifications-toggle" type="checkbox" />
        Enable notifications
      </label>
    </p>

    <p>
      <button data-testid="save-button">Save</button>
    </p>
    <p data-testid="save-confirmation" class="save-confirmation">Saved.</p>

    <script>
      document.querySelector('[data-testid="save-button"]').addEventListener('click', () => {
        document.querySelector('[data-testid="save-confirmation"]').classList.add('save-confirmation--visible');
      });
    </script>
  </body>
</html>
