<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Settings page of the mock app the presenter agent operates."
    />
    <title>Target App — Settings</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a data-testid="nav-home" href="index.html">Home</a>
      <a data-testid="nav-settings" aria-current="page" href="settings.html">Settings</a>
      <a data-testid="nav-orders" href="orders.html">Orders</a>
    </nav>

    <main>
      <h1 data-testid="settings-heading">Settings</h1>

      <p>
        <label>
          <input data-testid="notifications-toggle" type="checkbox" />
          Enable notifications
        </label>
      </p>

      <p class="field">
        <label for="notes-input">Notes</label>
        <textarea id="notes-input" name="notes" data-testid="notes-input" rows="3"></textarea>
      </p>

      <p class="field">
        <label for="plan-select">Plan</label>
        <select id="plan-select" name="plan" data-testid="plan-select">
          <option value="free">Free plan</option>
          <option value="pro">Pro plan</option>
          <option value="team">Team plan</option>
        </select>
      </p>

      <p>
        <button data-testid="save-button">Save</button>
      </p>
      <p data-testid="save-confirmation" class="save-confirmation">Saved.</p>
    </main>

    <script defer src="settings.js"></script>
  </body>
</html>
