<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Acme Dashboard — Home</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <strong>Acme Dashboard</strong>
    <a href="./index.html" class="active" data-testid="nav-home">Home</a>
    <a href="./settings.html" data-testid="nav-settings">Settings</a>
  </header>
  <main>
    <h1>Welcome back</h1>
    <p>This is a stand-in "cloned app" — a couple of static pages, not a real crawl of anything.</p>

    <div class="card">
      <p id="counter-label" data-testid="counter-label">Widgets deployed: <strong id="counter">0</strong></p>
      <button id="deploy-btn" data-testid="deploy-widget-btn">Deploy a widget</button>
    </div>
  </main>

  <script>
    // Minimal same-page interactivity so there's something for the agent to click.
    const counterEl = document.getElementById('counter');
    document.getElementById('deploy-btn').addEventListener('click', () => {
      counterEl.textContent = String(Number(counterEl.textContent) + 1);
    });
  </script>
</body>
</html>
