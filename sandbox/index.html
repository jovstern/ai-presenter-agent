<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Demo Sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1120; }
    #stage { position: relative; width: 100%; height: 100%; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <div id="stage">
    <!-- The "cloned app" stand-in — same-origin with this page on purpose, see docs/sandbox-simulation.md -->
    <iframe id="ds-target-iframe" src="/target-app/index.html" data-testid="ds-target-iframe"></iframe>

    <!-- The agent-client script (a separate deployable bundle) mounts its React app into a
         shadow root on this element. data-session-token is set by bridge.js below. -->
    <ds-agent-avatar id="ds-agent"></ds-agent-avatar>
  </div>

  <!-- Order matters: the bridge must be listening before the agent-client can post to it. -->
  <script src="./bridge.js"></script>
  <script src="/agent-client/agent-client.js"></script>
</body>
</html>
