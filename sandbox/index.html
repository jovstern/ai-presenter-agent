<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A voice presenter agent that talks about and operates a demo web app."
    />
    <title>AI Presenter Agent — sandbox</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100vh;
        border: none;
      }
    </style>
  </head>
  <body>
    <!-- Named: the target app inside the frame has its own <main>, and axe
         counts both as one tree (landmark-unique). -->
    <main aria-label="Target app sandbox">
      <iframe id="target-app-frame" title="Target app" src="/target-app/index.html"></iframe>
    </main>
    <!-- No inline script: the CSP is script-src 'self' (server/app.js). The server
         templates the page nonce into data-ds-nonce, and agent-client.js reads it off
         its own tag (document.currentScript) while it runs. Deferred scripts keep their
         order and run before DOMContentLoaded: bridge.js (which catches up on an iframe
         that already loaded) before agent-client.js. -->
    <script defer src="/sandbox/bridge.js"></script>
    <script defer src="/agent-client/agent-client.js" data-ds-nonce="%%DS_NONCE%%"></script>
  </body>
</html>
